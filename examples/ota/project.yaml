# yaml-language-server: $schema=.assess/schema-project.json
# Project information: who carried out the assessment, when and against which standards.
# Every file in this project is described in schema.yaml.
name: Over-the-air update system
description: Architecture of the over-the-air software update system of a vehicle line, as the OEM owns it, from the supplier hand-over and the signing keys through production and distribution to the installation in the vehicle. The data is made up and was generated by AI. It does not describe a real system.
standards: [ISO/SAE 21434:2021, ISO 24089:2023, UN Regulation No. 155, UN Regulation No. 156]
assessors: [OTA security lead]
date: 2026-10-16
# The documents the assessment is based on, and where to find them. The report lists them.
sources:
  - name: OTA system architecture description
    location: OTA-ARCH-001
    version: "0.9"
  - name: Certificate policy and practice statement of the OEM PKI
    location: PKI-CPS-001
    version: "2.1"
  - name: Software release and signing process
    location: SWR-PROC-014
    version: "1.6"
  - name: Vehicle diagnostic and flashing specification (UDS over CAN and DoIP)
    location: VEH-DIAG-007
    version: "4.2"
  - name: Production provisioning specification
    location: PRD-PROV-003
    version: "1.3"
  - name: ISO 24089, Road vehicles - Software update engineering
    location: ISO
    version: "2023"
  - name: UN Regulation No. 156, software update and software updates management system
    location: UNECE
    version: "2021"
# Further information for the report, in the order written: a title and either a text or a table.
extra:
  - title: Disclaimer
    text: This example was generated by AI. The data is made up. It does not describe a real system, and it is not a model of how a normal system looks. Do not use it in production or as the basis of a real assessment. Use it only to see how assess works.
  - title: Scope
    text: |
      The model covers everything the OEM is responsible for in the over-the-air update of one vehicle line: the
      backend that prepares, authorises and distributes software, the PKI and the keys behind every signature, the
      plant systems that give a vehicle its identity and first software, and the update stack in the vehicle.

      Suppliers, the content delivery network, the owner's app, workshops, ECU manufacturers and the security
      operations centre are context. They are drawn, but they are not part of the item.
  - title: Responsibilities
    columns: [Area, Owner, What they run]
    rows:
      - [OTA backend, OTA platform team, "Release management, campaign management, package repository, vehicle gateway, telemetry"]
      - [Signing, Release engineering, "The software signing service and its HSM, the offline boot key HSM"]
      - [PKI, PKI team, "The offline root CA, the issuing CAs, the registration authority and the revocation service"]
      - [Production, Plant IT with the OTA platform team, "The provisioning server, the software store and the end-of-line stations"]
      - [Vehicle update stack, Vehicle software, "OTA client, update orchestrator, gateway rules, bootloaders and installers"]
  - title: Status of this model
    text: |
      The model is complete for this release: the architecture, the assets, the damage scenarios, the threat
      scenarios with their attack steps, the controls, the risks and the treatment decisions. Every risk has a
      calculated value, every cybersecurity goal has an item in the tracker, and nothing is open.

      The risks that stay higher are attacks that are still feasible after the controls, or that cause a severe
      damage. Some of them also reach many vehicles, and a path that reaches a batch or the whole fleet raises
      the impact of its damage scenario. The highest risk left is 4. A very hard attack stays small however far
      it reaches, which is why most risks are at 2 after the controls. The risks above the affinity stay visible
      as goals. The decisions say what is reduced, shared, avoided or accepted, and why.

      This is a demonstration. Replace the data with your own.
