# yaml-language-server: $schema=../.assess/schema.json
# Risks: the risk of each threat scenario, written risk <threat-id>: with the id of its threat scenario
#   type       Goal when the risk before any control is above the risk affinity of the policy, else Claim
#   base       the risk value with every control ignored
#   residual   the risk value with the controls applied (except those the policy excludes)
#   treatment  your decision: Avoid, Reduce, Share or Accept
# Generated by "assess generate risks": it adds the risks that are missing and keeps type, base and
# residual up to date. Do not edit those three by hand. The rest is yours, for example the description
# and the treatment.

risk supplier-delivery-tampering:
  name: Risk of tampering with Supplier delivery
  type: Goal
  base: 3
  residual: 2
  description: Malicious code arrives in a supplier delivery and is built, signed and installed like any other.
  treatment: Reduce
  rationale: Review, binary comparison and the account hardening bring it down. What remains is a supplier who delivers bad code on purpose, which no review can exclude.
  reference: [OTA-2101]

risk release-candidate-tampering:
  name: Risk of tampering with Release candidate
  type: Goal
  base: 4
  residual: 2
  description: The images that are signed are not the ones that were reviewed, because a library poisons the build or an image is changed after approval.
  treatment: Reduce
  rationale: Pinned dependencies, isolated runners and the digest check in the signing service bring it down. What remains is an upstream library that is poisoned for a long time before it is used.
  reference: [OTA-2102]

risk approval-record-tampering:
  name: Risk of tampering with Approval record
  type: Goal
  base: 5
  residual: 3
  description: A release or a campaign is approved by someone who should not have been able to, and the next steps act on it.
  treatment: Reduce
  rationale: Second approver, device-bound sessions and the callback of the helpdesk bring it down. Two colluding approvers are what remains, and the audit log and the signing alerts watch for them.
  reference: [OTA-2103]

risk backoffice-portal-spoofing:
  name: Risk of spoofing of Back-office portal
  type: Goal
  base: 5
  residual: 2
  description: Someone acts in the portal as a release manager or a campaign manager.
  treatment: Reduce
  rationale: Hardware tokens, the helpdesk callback and device-bound sessions bring it down. What remains takes weeks and a foothold inside.
  reference: [OTA-2104]

risk signing-service-tampering:
  name: Risk of tampering with Software signing service
  type: Claim
  base: 2
  residual: 2
  description: The signing service signs something that was not approved.
  treatment: Reduce
  rationale: Both ways need a foothold in the build network and a pipeline identity, or two insiders. The monitoring raises an alarm on every signature outside a release. The controls leave an attack of this effort, which counts for more because it reaches the whole fleet.
  reference: [OTA-2114]

risk software-signing-private-key-disclosure:
  name: Risk of information disclosure of Software signing private key
  type: Claim
  base: 2
  residual: 2
  description: The key that vehicles accept for software is taken.
  treatment: Reduce
  rationale: The key is in a certified HSM at two sites, with the backups in split custody. What is left needs a laboratory of a state or an insider with a quorum. The risk is low because the attack is very hard. It would be larger if the attack were easier, because it reaches the whole fleet.
  reference: [OTA-2115]

risk software-signing-private-key-denial:
  name: Risk of denial of service of Software signing private key
  type: Claim
  base: 2
  residual: 2
  description: The signing key and all its backups are destroyed.
  treatment: Reduce
  rationale: It takes an insider with rights at both sites and the backups. The new key would have to be put into the vehicles by a campaign that the old key signed first, so the plan is to keep a second signing key ready.
  reference: [OTA-2116]

risk software-signing-certificate-spoofing:
  name: Risk of spoofing of Software signing certificate
  type: Goal
  base: 4
  residual: 2
  description: The attacker gets a signing certificate for their own key, and vehicles accept their software.
  treatment: Reduce
  rationale: Two approvals, key attestation and the segmentation of the PKI network bring it down. A taken-over registration authority together with a colluding approver is what remains.
  reference: [OTA-2105]

risk secure-boot-private-key-disclosure:
  name: Risk of information disclosure of Secure boot private key
  type: Claim
  base: 2
  residual: 2
  description: The key that signs bootloaders is taken.
  treatment: Reduce
  rationale: The key is offline and used a few times a year. A bootloader signed with it still has to be put on a vehicle by hand, so the reach in practice is small.
  reference: [OTA-2117]

risk campaign-definition-tampering:
  name: Risk of tampering with Campaign definition
  type: Goal
  base: 5
  residual: 2
  description: A campaign sends valid software to vehicles that it does not fit, in one wave.
  treatment: Reduce
  rationale: The second approval and the staged roll-out with an automatic stop keep a bad campaign from reaching the fleet. The stop acts only after the first wave, so the first wave is not kept from its vehicles.
  reference: [OTA-2106]

risk update-director-tampering:
  name: Risk of tampering with Update director
  type: Goal
  base: 3
  residual: 2
  description: The director authorises installations that no campaign asked for.
  treatment: Reduce
  rationale: Hardening of the cloud administrator accounts and the policy in the director HSM on what it may sign bring it down.
  reference: [OTA-2107]

risk authorisation-signing-private-key-disclosure:
  name: Risk of information disclosure of Authorisation signing private key
  type: Goal
  base: 3
  residual: 2
  description: The key that signs authorisations is taken.
  treatment: Reduce
  rationale: The key is in an HSM and its backup is in split custody. It cannot sign software, so the attacker can only direct valid packages.
  reference: [OTA-2118]

risk vehicle-configuration-tampering:
  name: Risk of tampering with Vehicle configuration
  type: Goal
  base: 4
  residual: 2
  description: The registry holds a wrong inventory for a vehicle, so it gets a package for another variant or none.
  treatment: Reduce
  rationale: Authorisation per VIN, rate limits and detection bring it down.
  reference: [OTA-2110]

risk vehicle-configuration-disclosure:
  name: Risk of information disclosure of Vehicle configuration
  type: Goal
  base: 5
  residual: 2
  description: The inventory of the fleet is read through the API or from the database.
  treatment: Reduce
  rationale: The same controls, and the hardening of the cloud accounts, bring it down.
  reference: [OTA-2111]

risk update-package-tampering:
  name: Risk of tampering with Update package
  type: Goal
  base: 4
  residual: 2
  description: A package that was changed is served to vehicles at the content delivery network or at the origin.
  treatment: Reduce
  rationale: The verification in the vehicle and the lock on the repository bring it down. What remains is the theft of the signing key or a flaw in the verifier, which have their own risks.
  reference: [OTA-2108]

risk update-package-disclosure:
  name: Risk of information disclosure of Update package
  type: Goal
  base: 5
  residual: 3
  description: Anyone who owns a vehicle, or has a workshop login, can read the firmware of the whole line, and so can see where to attack it.
  treatment: Reduce
  rationale: 'The images are encrypted for the vehicles, which closes the workshop path and the download link: they give ciphertext. The owner of a vehicle can still read the images from the unit after decryption, with a debug interface or a memory dump, so what is left is one owner with the skill. The risk is not lower because what one owner reads is known for the whole line.'
  reference: [OTA-2210]

risk vehicle-api-gateway-denial:
  name: Risk of denial of service of Vehicle API gateway
  type: Goal
  base: 5
  residual: 2
  description: The vehicle interface is flooded and no vehicle can check in.
  treatment: Reduce
  rationale: The protection in front of the interface absorbs floods. Vehicles retry, so a delay is the worst that remains.
  reference: [OTA-2112]

risk vehicle-api-gateway-spoofing:
  name: Risk of spoofing of Vehicle API gateway
  type: Goal
  base: 3
  residual: 2
  description: A vehicle talks to a false backend that a rogue base station puts between them.
  treatment: Accept
  rationale: The vehicle accepts only certificates of the pinned backend CA, so the base station can drop or delay the traffic but not read it.
  reference: [OTA-2119]

risk backend-tls-private-key-disclosure:
  name: Risk of information disclosure of Backend TLS private key
  type: Goal
  base: 3
  residual: 2
  description: The TLS key of the gateway is exported from the key store.
  treatment: Reduce
  rationale: The key store does not export, and changing its policy needs a cloud administrator and raises an alarm.
  reference: [OTA-2120]

risk workshop-interface-spoofing:
  name: Risk of spoofing of Workshop interface
  type: Goal
  base: 5
  residual: 4
  description: Someone passes as a workshop and takes packages without owning a vehicle.
  treatment: Reduce
  rationale: Second factor and device binding bring it down. A tester certificate that is stolen is the way around, and it gives packages only.
  reference: [OTA-2109]

risk audit-log-tampering:
  name: Risk of tampering with Audit log
  type: Goal
  base: 3
  residual: 2
  description: Entries of the audit log are deleted or changed.
  treatment: Reduce
  rationale: The log is in write-once storage with a hash chain that the security operations centre holds.
  reference: [OTA-2121]

risk audit-log-repudiation:
  name: Risk of repudiation of Audit log
  type: Goal
  base: 5
  residual: 2
  description: A person who acted denies it, because the log cannot tell who used a shared account or the entry is gone.
  treatment: Reduce
  rationale: The immutable storage of the log, named accounts and the sealed emergency account bring it down.
  reference: [OTA-2113]

risk root-ca-private-key-disclosure:
  name: Risk of information disclosure of Root CA private key
  type: Claim
  base: 2
  residual: 2
  description: The root key is taken and the attacker can certify any CA.
  treatment: Reduce
  rationale: The root is offline, in a certified HSM, with custodians in three places, and is used for ceremonies only. The attack is very hard, so the risk is low even though it reaches the whole fleet.
  reference: [OTA-2122]

risk root-ca-private-key-denial:
  name: Risk of denial of service of Root CA private key
  type: Claim
  base: 2
  residual: 2
  description: The root HSM, its backup and the cards are destroyed.
  treatment: Reduce
  rationale: Destroying all of it takes a break-in at two sites. The fallback is a new root, introduced through a workshop campaign, and the plan is in the certificate policy.
  reference: [OTA-2123]

risk registration-authority-tampering:
  name: Risk of tampering with Registration authority
  type: Claim
  base: 2
  residual: 2
  description: The registration authority is taken over through a flaw in its API.
  treatment: Reduce
  rationale: The flaw has to be found in a service that only the gateway reaches, and the CAs still check the profile of every request.
  reference: [OTA-2124]

risk vehicle-ca-tampering:
  name: Risk of tampering with Vehicle CA (intermediate)
  type: Claim
  base: 2
  residual: 2
  description: Rogue vehicle certificates are issued through the vehicle CA.
  treatment: Reduce
  rationale: It needs a breach of the PKI network and the credentials of the CA host, and the volume of issued certificates is watched.
  reference: [OTA-2125]

risk certificate-revocation-list-denial:
  name: Risk of denial of service of Certificate revocation list
  type: Claim
  base: 1
  residual: 1
  description: After a key is stolen, the revocation does not reach a vehicle.
  treatment: Reduce
  rationale: It needs the stolen key and a presence next to the vehicle for a week. The vehicle limits updates when its list is old.
  reference: [OTA-2126]

risk provisioning-server-tampering:
  name: Risk of tampering with Plant provisioning server
  type: Claim
  base: 2
  residual: 2
  description: The plant provisioning server is used to get certificates for vehicles that were not built.
  treatment: Reduce
  rationale: It needs a foothold in the production network. The registration authority checks the build record of every VIN and limits the number of requests.
  reference: [OTA-2127]

risk provisioning-server-denial:
  name: Risk of denial of service of Plant provisioning server
  type: Claim
  base: 2
  residual: 2
  description: Ransomware stops the provisioning server and the line.
  treatment: Share
  rationale: A stop can last days, and the damage falls on the production of the OEM, not on the road user. The business interruption cover of the group's cyber insurance carries the cost of a stop, and the service agreement with the plant IT provider fixes the restore times. The plant keeps backups and an offline procedure for the rest.
  reference: [PLANT-SLA-3, CYBER-INS-2026-17]

risk trust-anchor-bundle-tampering:
  name: Risk of tampering with Trust anchor bundle
  type: Goal
  base: 3
  residual: 2
  description: The bundle that is written into new vehicles holds the attacker's root.
  treatment: Reduce
  rationale: The bundle is signed and the stations check its hash from a second channel, so a change also needs the signatures.
  reference: [OTA-2128]

risk secure-boot-public-key-tampering:
  name: Risk of tampering with Secure boot public key
  type: Claim
  base: 2
  residual: 2
  description: Another secure boot key is fixed into a batch of ECUs.
  treatment: Share
  rationale: It needs an insider at the manufacturer for months. The ECU manufacturer is responsible for the key that it fixes into the ECUs, and the cybersecurity interface agreement asks for dual control of the key, a yearly audit by the OEM and a signed record of every batch. The record shows a substituted key, and the OEM checks it when the batch arrives.
  reference: [CIA-ECU-04]

risk lifecycle-state-tampering:
  name: Risk of tampering with Lifecycle state
  type: Claim
  base: 2
  residual: 2
  description: A delivered vehicle is set back to the production state.
  treatment: Accept
  rationale: The state is in one-way hardware, and the other way needs a flaw in the gateway and a dongle in the vehicle.

risk cellular-interface-spoofing:
  name: Risk of spoofing of Cellular interface
  type: Claim
  base: 2
  residual: 2
  description: A rogue base station takes the connection of a vehicle.
  treatment: Share
  rationale: The authentication of the network is the job of the mobile operator. The operator contract asks for 4G and 5G with mutual authentication, no fallback to 2G on the profile of the vehicles, and a report of every rogue cell that the operator finds. What is left is a rogue base station that can drop or delay what passes, but the vehicle accepts no software from it, because it accepts only certificates of the pinned backend CA.
  reference: [MNO-AGR-2025-03]

risk ota-client-tampering:
  name: Risk of tampering with OTA client
  type: Claim
  base: 2
  residual: 2
  description: Code of the attacker runs in the OTA client of a telematics unit.
  treatment: Reduce
  rationale: The routes need months of reverse engineering and a taken-over content delivery network, or a modem exploit. Hardened parsing, the separation of the processes and secure boot limit what code in the client can do.
  reference: [OTA-2129]

risk package-verifier-tampering:
  name: Risk of tampering with Package verifier
  type: Claim
  base: 2
  residual: 2
  description: A crafted package makes the verifier accept what it should refuse.
  treatment: Reduce
  rationale: A flaw in the parser is found by fuzzing and is fixed by an update. The parser is memory-safe where possible and runs in a sandbox.
  reference: [OTA-2130]

risk secure-time-tampering:
  name: Risk of tampering with Secure time
  type: Goal
  base: 3
  residual: 2
  description: The clock of the secure element is set back.
  treatment: Reduce
  rationale: The plausibility check refuses a jump and a clock that goes back, so the attacker has to drift the satellite time slowly while the vehicle has lost its backend time, and that takes days next to the vehicle. A recorded stamp does not work against the fresh request, and authorisations have a short window.
  reference: [OTA-2131]

risk consent-ui-tampering:
  name: Risk of tampering with Update consent screen
  type: Claim
  base: 2
  residual: 1
  description: Code on the infotainment unit sends the consent of the driver.
  treatment: Accept
  rationale: The orchestrator accepts only a signed decision for the current update, so code elsewhere on the unit cannot send one.
  reference: [OTA-2132]

risk download-link-denial:
  name: Risk of denial of service of Download link
  type: Goal
  base: 3
  residual: 3
  description: A jammer keeps a vehicle from downloading a package.
  treatment: Avoid
  rationale: 'A jammer can only delay an update. Besides the mobile network the OTA client has two more paths: the Wi-Fi of the owner, and the workshop, which brings the package on a signed medium. Keeping a vehicle away from every path takes a presence at several places for as long as it lasts, so the denial of the download is avoided by design. The model keeps the scenario with its value, to show what the decision avoids.'
  reference: [OTA-2133]

risk update-orchestrator-tampering:
  name: Risk of tampering with Update orchestrator
  type: Claim
  base: 2
  residual: 2
  description: An update starts while the vehicle drives.
  treatment: Reduce
  rationale: Faking the parked state needs access to the wiring or code in the telematics unit, and several signals that are authenticated. The orchestrator also stops when the state changes.
  reference: [OTA-2134]

risk central-gateway-tampering:
  name: Risk of tampering with Central gateway
  type: Goal
  base: 4
  residual: 3
  description: A dongle opens a programming session and erases a controller.
  treatment: Reduce
  rationale: A dongle without a credential gets no session. The attacker needs a tester certificate or a flaw in the gateway, and the vehicle can be recovered in a workshop.
  reference: [OTA-2135]

risk powertrain-can-tampering:
  name: Risk of tampering with Powertrain CAN
  type: Goal
  base: 4
  residual: 4
  description: A device on the wiring interrupts a flashing session or says that the vehicle is parked.
  treatment: Avoid
  rationale: 'A device on the wiring can interrupt a flashing session, and a controller without a second image is then left without software. Controllers that have no fallback image are not updated over the air: they are flashed in the workshop, where the recovery is part of the job. The controllers that are updated over the air keep the old image until the new one is verified. The model keeps the scenario with its value, to show what the decision avoids.'
  reference: [OTA-2136]

risk vcu-bootloader-tampering:
  name: Risk of tampering with VCU bootloader
  type: Goal
  base: 3
  residual: 2
  description: An image without a valid signature is flashed to the vehicle control unit.
  treatment: Accept
  rationale: The bootloader checks the signature of the image and of the flash driver. Bypassing it needs a fault attack on the controller, with the housing open.
  reference: [OTA-2137]

risk bms-bootloader-tampering:
  name: Risk of tampering with BMS bootloader
  type: Claim
  base: 2
  residual: 2
  description: The attacker loads a flash driver of their own into the battery management system.
  treatment: Accept
  rationale: The bootloader verifies the flash driver before it runs it. The attacker needs a flaw in the transfer service and the vehicle on the bench.

risk telematics-unit-tampering:
  name: Risk of tampering with Telematics unit (TCU)
  type: Goal
  base: 3
  residual: 2
  description: An implant or a system image of the attacker is put on the telematics unit.
  treatment: Accept
  rationale: It needs the unit open on a bench. Secure boot and the locked debug port stop what a clip and a laptop can do.
  reference: [OTA-2138]

risk tcu-debug-port-spoofing:
  name: Risk of spoofing of TCU debug port
  type: Goal
  base: 4
  residual: 2
  description: The attacker gets debug access to the telematics unit.
  treatment: Accept
  rationale: The ports are locked by the lifecycle. Opening them again needs a fault attack on one unit at a time.
  reference: [OTA-2139]

risk tcu-hsm-tampering:
  name: Risk of tampering with TCU secure element
  type: Goal
  base: 3
  residual: 2
  description: The secure element is made to act for the attacker.
  treatment: Accept
  rationale: A device on its bus meets an encrypted and authenticated channel, and code in the unit meets the limits of the key usage policy.
  reference: [OTA-2140]

risk vehicle-private-key-disclosure:
  name: Risk of information disclosure of Vehicle private key
  type: Claim
  base: 1
  residual: 1
  description: The identity key of a vehicle is read from its secure element in a laboratory.
  treatment: Accept
  rationale: The element is evaluated against side channels and faults. The attack needs a laboratory and a vehicle, and it gives the identity of one vehicle only.

risk installed-root-certificate-tampering:
  name: Risk of tampering with Installed root certificate
  type: Claim
  base: 2
  residual: 2
  description: The root in a delivered vehicle is replaced with the attacker's.
  treatment: Accept
  rationale: The secure element accepts a new root only on a command that the PKI signed, and the vehicle must first be put back to the production state.

risk vcu-rollback-counter-tampering:
  name: Risk of tampering with VCU rollback counter
  type: Claim
  base: 1
  residual: 1
  description: The rollback counter of the vehicle control unit is set back.
  treatment: Accept
  rationale: The counter is written with a MAC under a device key, and the attack needs the controller open on a bench.
